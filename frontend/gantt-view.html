<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gantt View - Saralta</title>
    <link rel="stylesheet" href="css/style.css?v=15">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="app-body">
    <header class="topbar">
        <div class="topbar-left">
            <div class="app-logo">
                <img src="assets/logo.png" alt="Saralta" class="logo-img">
                <span>Saralta</span>
            </div>
        </div>
        <div class="topbar-right">
            <div class="notification-wrap">
                <button type="button" class="topbar-icon-btn" id="notification-trigger" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"></path>
                        <path d="M10 20a2 2 0 0 0 4 0"></path>
                    </svg>
                    <span class="notification-badge" id="notification-count" hidden>0</span>
                </button>
                <div class="notification-dropdown" id="notification-dropdown" hidden></div>
            </div>
            <div class="profile-menu">
                <button type="button" class="profile-menu-trigger" id="profile-menu-trigger" aria-haspopup="true" aria-expanded="false">
                    <div class="user-info">
                        <div class="user-avatar" id="user-avatar"></div>
                        <div class="user-meta">
                            <span class="user-name" id="user-badge">User</span>
                            <span class="user-role">ID: <span id="topbar-user-id">-</span> · <span id="user-role">Member</span></span>
                        </div>
                    </div>
                </button>
                <div class="profile-menu-dropdown" id="profile-menu-dropdown" hidden>
                    <button type="button" class="profile-menu-item" id="profile-edit-name">Edit name</button>
                </div>
            </div>
            <button type="button" class="btn btn-ghost" onclick="goToDashboard()">Workspace</button>
            <button type="button" class="btn btn-ghost" onclick="goToBoardPage()">Dashboard</button>
            <button type="button" class="btn btn-ghost" onclick="goToStatisticsPage()">Statistics</button>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar" aria-label="Gantt navigation">
            <div class="sidebar-inner">
                <div class="sidebar-header">
                    <div class="sidebar-title-wrap">
                        <div class="sidebar-title sidebar-title--main"><h3>Command Panel</h3></div>
                    </div>
                    <button type="button" class="sidebar-collapse-btn" id="sidebar-collapse-btn" onclick="toggleSidebarCollapse()" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar">
                        <span class="sidebar-collapse-btn-bar" aria-hidden="true"></span>
                    </button>
                </div>
                <div class="sidebar-title">Navigation</div>
                <nav class="sidebar-nav">
                    <button type="button" class="sidebar-item sidebar-item--overview" onclick="goToHomePage()">
                        <span class="sidebar-overview-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 11.5 12 4l9 7.5"></path>
                                <path d="M5 10.5V20h14v-9.5"></path>
                            </svg>
                        </span>
                        <span class="sidebar-label">Home</span>
                    </button>
                    <button type="button" class="sidebar-item sidebar-item--workspace" onclick="goToDashboard()">
                        <span class="sidebar-workspace-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                                <path d="M3 10h18"></path>
                            </svg>
                        </span>
                        <span class="sidebar-label">Workspace</span>
                    </button>
                    <button type="button" class="sidebar-item sidebar-item--board" onclick="goToBoardPage()">
                        <span class="sidebar-board-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                                <path d="M8 8h.01"></path>
                                <path d="M12 8h5"></path>
                                <path d="M8 12h.01"></path>
                                <path d="M12 12h5"></path>
                                <path d="M8 16h.01"></path>
                                <path d="M12 16h5"></path>
                            </svg>
                        </span>
                        <span class="sidebar-label">Dashboard</span>
                    </button>
                    <button type="button" class="sidebar-item sidebar-item--stats" onclick="goToStatisticsPage()">
                        <span class="sidebar-stats-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="20" x2="18" y2="10"></line>
                                <line x1="12" y1="20" x2="12" y2="4"></line>
                                <line x1="6" y1="20" x2="6" y2="14"></line>
                            </svg>
                        </span>
                        <span class="sidebar-label">Statistics</span>
                    </button>
                    <button type="button" class="sidebar-item sidebar-item--gantt sidebar-item--active" aria-current="page">
                        <span class="sidebar-gantt-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 6h16"></path>
                                <path d="M4 12h10"></path>
                                <path d="M4 18h7"></path>
                                <rect x="8" y="5" width="5" height="2" rx="1"></rect>
                                <rect x="10" y="11" width="8" height="2" rx="1"></rect>
                                <rect x="7" y="17" width="11" height="2" rx="1"></rect>
                            </svg>
                        </span>
                        <span class="sidebar-label">Gantt View</span>
                    </button>
                    <button type="button" class="sidebar-item sidebar-item--help" onclick="window.location.href='help.html'">
                        <span class="sidebar-help-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"></circle>
                                <path d="M9.4 9a2.6 2.6 0 1 1 4.6 1.6c-.7.8-1.6 1.2-2 1.9-.2.3-.3.6-.3 1.1"></path>
                                <circle cx="12" cy="17.2" r="1"></circle>
                            </svg>
                        </span>
                        <span class="sidebar-label">Help Center</span>
                    </button>
                    <button type="button" class="sidebar-item sidebar-item--my-info" onclick="window.location.href='my-info.html'">
                        <span class="sidebar-my-info-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21a8 8 0 1 0-16 0"></path>
                                <circle cx="12" cy="8" r="4"></circle>
                            </svg>
                        </span>
                        <span class="sidebar-label">My Info</span>
                    </button>
                </nav>
                <div class="sidebar-footer">
                    <button type="button" class="sidebar-item sidebar-item--logout" onclick="logout()">
                        <span class="sidebar-logout-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                        </span>
                        <span class="sidebar-label">Log out</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="main-content main-content--gantt-page">
            <section class="stats-gantt-section" aria-label="Task Gantt chart">
                <article class="stats-panel stats-panel--gantt">
                    <div class="stats-panel-head stats-panel-head--gantt">
                        <button
                            type="button"
                            class="stats-gantt-filter-toggle"
                            id="stats-gantt-filter-toggle"
                            aria-expanded="true"
                            aria-controls="stats-gantt-controls"
                            aria-label="Collapse gantt filters"
                            title="Collapse filters">
                            <span class="stats-gantt-filter-toggle-icon" aria-hidden="true"></span>
                        </button>
                        <div class="stats-gantt-controls" id="stats-gantt-controls">
                            <div class="stats-gantt-filter-grid">
                                <div class="form-group">
                                    <label for="stats-gantt-division">Division</label>
                                    <select id="stats-gantt-division" class="input">
                                        <option value="">All divisions</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="stats-gantt-group">Group</label>
                                    <select id="stats-gantt-group" class="input">
                                        <option value="">All groups</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="stats-gantt-activity">Activity / Project</label>
                                    <select id="stats-gantt-activity" class="input">
                                        <option value="">All activities</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="stats-gantt-team">Team</label>
                                    <select id="stats-gantt-team" class="input">
                                        <option value="">All teams</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="stats-gantt-category">Category</label>
                                    <select id="stats-gantt-category" class="input">
                                        <option value="">All categories</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="stats-gantt-scale-mode">Timeline view</label>
                                    <select id="stats-gantt-scale-mode" class="input">
                                        <option value="custom" selected>Custom interval</option>
                                        <option value="financial-quarter">Financial quarters</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="stats-gantt-scale-value">Interval value</label>
                                    <input id="stats-gantt-scale-value" class="input" type="number" min="1" step="1" value="1">
                                </div>
                                <div class="form-group">
                                    <label for="stats-gantt-scale-unit">Interval unit</label>
                                    <select id="stats-gantt-scale-unit" class="input">
                                        <option value="days">Days</option>
                                        <option value="months" selected>Months</option>
                                        <option value="years">Years</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="stats-gantt-view-mode">View mode</label>
                                    <select id="stats-gantt-view-mode" class="input">
                                        <option value="detailed">Detailed</option>
                                        <option value="simple" selected>Simple</option>
                                    </select>
                                </div>
                            </div>
                            <div class="stats-gantt-toolbar">
                                <div class="stats-gantt-levels" id="stats-gantt-levels" aria-label="Task level filters">
                                    <button type="button" class="stats-gantt-level-btn is-active" data-gantt-level="all">All Tasks</button>
                                    <button type="button" class="stats-gantt-level-btn" data-gantt-level="1">L1</button>
                                    <button type="button" class="stats-gantt-level-btn" data-gantt-level="2">L2</button>
                                    <button type="button" class="stats-gantt-level-btn" data-gantt-level="3">L3</button>
                                </div>
                                <div class="stats-gantt-legend" aria-label="Gantt legend">
                                    <span class="stats-gantt-legend-item"><span class="stats-gantt-legend-swatch stats-gantt-legend-swatch--progress"></span>Progress</span>
                                    <span class="stats-gantt-legend-item"><span class="stats-gantt-legend-swatch stats-gantt-legend-swatch--dependency"></span>Dependency</span>
                                    <span class="stats-gantt-legend-item"><span class="stats-gantt-legend-swatch stats-gantt-legend-swatch--delay"></span>Delay baseline</span>
                                    <span class="stats-gantt-legend-item"><span class="stats-gantt-legend-swatch stats-gantt-legend-swatch--today"></span>Today</span>
                                </div>
                                <div class="stats-gantt-overview" id="stats-gantt-overview"></div>
                            </div>
                        </div>
                    </div>
                    <div class="stats-gantt-wrap" id="stats-gantt-wrap" title="Drag to pan horizontally or vertically">
                        <div id="stats-gantt" class="stats-gantt"></div>
                        <p class="text-muted" id="stats-gantt-empty" hidden>No tasks available for the selected scope.</p>
                    </div>
                </article>
            </section>

            <div class="stats-loading" id="stats-loading">
                <p>Loading gantt view...</p>
            </div>
            <div class="stats-error" id="stats-error" hidden>
                <p>Unable to load the gantt view right now. Please try again.</p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/api.js?v=7"></script>
    <script src="js/topbar.js?v=1"></script>
    <script src="js/assistant.js?v=5"></script>
    <script src="js/statistics.js?v=13"></script>
</body>

</html>
